pluginManagement {
  def reactNativeGradlePlugin = new File(settingsDir, '../node_modules/@react-native/gradle-plugin').canonicalPath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(settingsDir, '../node_modules/expo-modules-autolinking/android/expo-gradle-plugin').canonicalPath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand([
    'node', '--no-warnings', '--eval', "require('expo/bin/autolinking')",
    'expo-modules-autolinking', 'react-native-config', '--platform', 'android', '--json'
  ])
}
expoAutolinking.useExpoModules()

rootProject.name = 'Финни'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
