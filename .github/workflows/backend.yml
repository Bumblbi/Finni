name: Backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finni
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: finni_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finni -d finni_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finni:testpassword@localhost:5432/finni_test
      TEST_DATABASE_URL: postgresql+psycopg://finni:testpassword@localhost:5432/finni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m app.content content/catalog.json
      - run: alembic downgrade base
      - run: pytest -q
      - run: python scripts/export_openapi.py && git diff --exit-code -- docs/openapi.json
      - run: docker build -t finni-backend:test .
